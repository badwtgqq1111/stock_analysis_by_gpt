[pipeline]
market = "CN"
start_date = "2014-01-01"
end_date = ""
adjust = "qfq"
days = 365
factor_set = "alpha_zoo_hk"
top_n = 10
preselection_model_slots = 4
max_workers_sync = 12
max_workers_stock_info = 8
max_workers_valuation = 12
max_workers_financial = 4
# BaoStock financial-statement requests are serialized by the provider and
# are not needed for the historical market-cap/PE/PB panel. Enable only for a
# separate statement-data refresh.
financial_metrics_enabled = false
financial_lookback_quarters = 1
valuation_history_source = "baidu"
valuation_history_period = "全部"
max_workers_factors = 8
export_csv = "output/results_cn"
preselection_path = "output/results_cn/cn_ensemble_preselected.csv"
quality_report_dir = "output/data_quality"
min_ohlcv_rows = 120
min_training_stocks = 50
# Fundamental and alternative fields are optional inputs. Their coverage is reported,
# not used to discard otherwise valid price/volume samples.
min_fundamental_coverage = 0.80

[factor_config.valuation_hk]
# Baidu valuations are sparse observations. Keep the as-of value, and give
# models an explicit stale marker after this many completed trading sessions.
stale_after_trading_days = 20

[stages]
daily_bars = true
intraday_bars = false
fundamental = true
alternative = false
features = true
regime = true
clean_panel = true
lightgbm = true
transformer = true
cnn = false
model_scores = true
# 最终选股由 preselection → pk 两阶段完成；保留 selection 命令仅用于
# 临时对照或人工显式调用，默认全流程不运行它。
selection = false
preselection = true
pk = true
exits = true
paper_outcomes = false
paper_account = false
graph_temporal = false
model_comparison = false
oos_predictions = false
strategy_labels = false

[daily_bars]
# Tencent is primary; fallbacks are BaoStock and Eastmoney.  The default chain
# intentionally excludes Sina because its V8 decoder is unsafe under bulk
# macOS concurrency.
data_source = "tencent"
frequencies = ["daily"]
skip_existing = true
complete_data = false

[intraday_bars]
# Enable only when minute-level features or execution research needs these bars.
# The window is independent from daily bars to avoid requesting minute data since 2014.
lookback_days = 1095
# Tencent retains a rolling recent window. Use 5min as the base frequency.
frequencies = ["5min", "15min", "30min", "60min"]
data_source = "tencent"
adjust = "raw"
max_workers = 16
derive_intraday_from_1min = false
derive_intraday_from_base = true
intraday_base_frequency = "5min"
min_daily_rows_for_intraday = 120
skip_existing = true
complete_data = false

[alternative]
# Import a locally collected CN search/news/announcement export. Required
# columns: stock_code plus published_at or available_at; optional sentiment_score.
input_path = ""
source = "manual_import"
output_dir = "output/alternative_data"

[industry]
# 当前生产主源使用 BaoStock 的证监会行业分类，接口已覆盖全市场且可稳定
# 调用。验证过的申万 2021 中继源可设为 sw2021_relay（需要
# CN_INDUSTRY_RELAY_BASE_KEY 或 TUSHARE_RELAY_KEY）；它写入独立 sw2021 快照，
# 只有完整同步通过覆盖率门禁后才更新注册表，不能混用两种 taxonomy。
taxonomy = "csrc_baostock"
min_coverage = 0.95

[relay_data]
# 仅在已配置 CN_INDUSTRY_RELAY_BASE_KEY 或 TUSHARE_RELAY_KEY 时开启。daily_basic
# 会覆盖同日估值快照的估值/股本字段；默认关闭，先用小股票池验证覆盖率与口径。
enabled = false
start_date = ""
end_date = ""
# Independent raw adj_factor audit snapshot; this does not overwrite OHLCV.
adjustment_factors_enabled = false

[strategy_labels]
days = 756
output_dir = "output/strategy_labels"

[clean_panel]
days = 365
cleaning_version = "p0.2.v1"
# Stock-aware row-group indexing makes larger batches efficient while keeping
# the wide pivot bounded. The source parquet is indexed once per clean-panel run.
feature_batch_size = 50

[model_features]
# Reject a source feature and its missing-value mask when the value is present
# on fewer than this share of a training fold. Sparse but usable features retain
# their masks; all-missing and constant inputs never enter model artifacts.
min_feature_coverage = 0.05
drop_constant_features = true

[regime]
days = 756
min_stocks = 20
trend_window = 60
breadth_window = 20
volatility_window = 20
hysteresis_days = 3
version = "regime.v1"
output_dir = "output/regime"

[lightgbm]
days = 365
label_horizon = 20
validation_days = 60
embargo_days = 20
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/lightgbm/alpha_zoo_hk"
# Leave empty for a fresh scheduled retrain; set a compatible model.txt for warm-start.
warm_start_path = ""
# The label is a within-date cross-sectional rank, so plain L2 has a floor equal
# to the label variance (~1/12). On this weak-signal problem, early stopping on
# L2 trims the booster to a handful of trees (measured: 3), which collapses the
# score range and breaks the cross-sectional ranking the selection stage reads.
# Default: stop on the mean per-date IC, with a hard floor on kept trees.
n_estimators = 500
learning_rate = 0.05
num_leaves = 64
max_depth = 8
min_child_samples = 30
reg_lambda = 10.0
# Early stopping is disabled because LightGBM trims the saved booster to the best
# iteration: with a flat metric it silently kept only 3 of 500 trees, which is
# what collapsed the score range.  Raise this only if the IC curve peaks late.
early_stopping_rounds = 0
min_trees = 100
eval_metric = "daily_ic" # daily_ic | l2 | none

[transformer]
days = 365
label_horizon = 20
validation_days = 60
embargo_days = 20
lookback = 60
epochs = 10
batch_size = 256
# Sequence samples are balanced across stocks. This budget avoids multi-GB
# copies of 60-day windows while retaining broad universe coverage.
max_samples = 12000
max_feature_pairs = 128
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/transformer/alpha_zoo_hk"
device = "auto" # CUDA -> Apple MPS -> CPU
# Set both values to a prior compatible checkpoint for incremental fine-tuning.
warm_start_path = ""
warm_start_manifest_path = ""

[cnn]
days = 365
label_horizon = 20
validation_days = 60
embargo_days = 20
lookback = 60
epochs = 10
batch_size = 256
max_samples = 12000
max_feature_pairs = 128
channels = 64
kernel_size = 3
num_layers = 3
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/cnn/alpha_zoo_hk"
device = "auto"

[model_scores]
days = 365
cleaning_version = "p0.2.v1"
# Do not select from a partially materialized latest date. The scorer falls
# back to the newest date that covers at least this share of the universe.
min_cross_section_coverage = 0.95
output_dir = "output/model_scores"
lightgbm_model_path = "output/models/cn/lightgbm/alpha_zoo_hk/model.txt"
lightgbm_manifest_path = "output/models/cn/lightgbm/alpha_zoo_hk/model_manifest.json"
transformer_model_path = "output/models/cn/transformer/alpha_zoo_hk/model.pt"
transformer_manifest_path = "output/models/cn/transformer/alpha_zoo_hk/model_manifest.json"
transformer_device = "auto"
cnn_model_path = ""
cnn_manifest_path = ""
cnn_device = "auto"

[selection]
model_scores_dir = "output/model_scores"
output_dir = "output/results_cn"
model = "ensemble" # lightgbm, transformer, or ensemble
top_n = 10
portfolio_mode = "mean_variance_cost_aware" # topn or mean_variance_cost_aware
initial_capital = 45000.0
# Optional override of the ensemble weights.  Leave empty to use the weights the
# regime file publishes (`model_weight_*`); set explicit weights when the regime
# split is known to bury a model that ranks a name well.
ensemble_weights = { lightgbm = 0.50, transformer = 0.50 }
# 再平衡节奏：>1 时，距上次再平衡不足 N 个交易日就沿用上一版组合（每日仍跑 exits）。
rebalance_stride_days = 5

# 可执行性约束：A 股按手交易，价格太高的小账户根本买不起一手。
# 候选需满足 price * lot_size <= equity * budget_ratio（budget_ratio ≈ gross/持仓数）。
[selection.affordability]
enabled = true
equity = 43137.82
lot_size = 100
budget_ratio = 0.15
tolerance = 1.0

# Price-setup signal layer.  When enabled, the Donchian channel recipe and the
# range breakout recipe are evaluated on the model shortlist for the selection
# date (bars up to that date only), and the strongest volume-confirmed hits are
# merged into the candidate pool as `signal_override` names with a minimum
# weight.  Set enabled = false to reproduce the pure model Top-N behavior.
[selection.signals]
enabled = true
recipes = ["donchian_pullback", "range_breakout", "limit_momentum", "value_reversal", "bottom_momentum"]
allowed_setup_types = ["donchian_breakout", "donchian_pullback", "range_breakout", "box_pullback", "limit_momentum", "value_reversal", "bottom_momentum"]
min_score = 60.0
# Require the cross-sectional model to agree before forcing a signal name.  85
# was calibrated against the collapsed LightGBM (3 kept trees); with the fixed
# model a 75th-percentile floor keeps the agreement filter meaningful without
# discarding volume-confirmed breakouts.
min_model_score = 75.0
scan_top_k = 5000
max_overrides = 2
recommendations_per_type = 2
forced_min_weight = 0.08
# The setup sleeve may not exceed this weight per name; momentum has its own,
# smaller budget below.
forced_max_weight = 0.20
override_rank = "volume_ratio_20" # 放量强度：Donchian 突破的成交量确认
lookback_sessions = 120

# Event study (2024-01..2026-09, 3.42M stock-days, market-neutral): the 20-day
# channel breakout is ~flat to negative (+0.00% / -0.56% at +1/+5 days) while a
# limit-up day carries +1.30% / +0.68% and decays to zero by +10 days.  The
# momentum sleeve therefore trades only that event, in a separate, small budget.
[selection.signals.momentum_sleeve]
enabled = true
setup_types = ["limit_momentum"]
slots = 1
min_weight = 0.05
max_weight = 0.10
min_model_score = 0.0 # 模型在动量的事件上无证据优势，改用独立预算与止损控制风险
rank = "volume_ratio_20"

# 长期回撤后的修复 sleeve：不要求模型横截面同意，使用独立小仓位与
# 均线/量能确认，覆盖类似老板电器的价值修复候选。
[selection.signals.reversal_sleeve]
enabled = true
setup_types = ["value_reversal"]
slots = 1
min_weight = 0.08
max_weight = 0.15
min_model_score = 0.0
rank = "score"

# 半年低点右侧确认 + 短期动量。行业超额收益在每日扫描中计算；其权重
# 与涨停动量 sleeve 一样保持较小，先经纸面组合验证后再调整。
[selection.signals.bottom_momentum_sleeve]
enabled = true
setup_types = ["bottom_momentum"]
slots = 1
min_weight = 0.05
max_weight = 0.10
min_model_score = 0.0
rank = "signal_score"

[selection.signals.risk_filters]
exclude_st = true
min_market_cap = 5000000000.0
min_median_amount_20d = 50000000.0

[selection.signals.recipe_params.donchian_pullback]
window = 20
breakout_min_pct = 0.005
tol_break = 0.015
tol_low = 0.03
tol_high = 0.05
max_sessions_since_breakout = 5
volume_dryup_ratio = 0.70
volume_expansion_min = 1.30
channel_width_max = 0.35
min_median_amount_20d = 10000000.0
min_score = 60.0

[selection.signals.recipe_params.limit_momentum]
min_gain = 0.095
channel_window = 20
min_median_amount_20d = 50000000.0
require_breakout = false
stop_pct = 0.05
expected_holding_days = 5
min_score = 60.0

[selection.signals.recipe_params.value_reversal]
min_return_120 = -0.10
min_return_252 = -0.08
min_reclaim_days = 1
min_score = 60.0
volume_ratio_min = 1.20

[selection.signals.recipe_params.bottom_momentum]
lookback = 126
min_rebound_atr = 1.0
min_relative20 = 0.0
min_volume_ratio = 1.10
min_score = 55.0
expected_holding_days = 10
stop_atr = 1.5

[selection.portfolio_constraints]
gross_exposure = 0.95
max_weight = 0.60
max_holdings = 6
weighting = "inverse_volatility"
max_industry_weight = 0.30
max_turnover = 0.50
max_participation = 0.05
risk_aversion = 2.0
turnover_penalty = 0.10
cost_penalty = 0.10

[exits]
# 持仓卖出规则：风险型（ST/流动性/停牌/模型排名下限）+ 兑现型（贴上沿/20日大涨减仓）
# + 结构型（单只权重上限）。收益型止损默认关闭，见 factor_engine/portfolio/exits.py 的依据说明。
holdings_path = "config/holdings_cn.csv"
days = 260
# 账户现金余额：持仓权重按「总资产 = 持仓 + 现金」计算（风险上限的正确分母）。
cash = 5913.82
output_dir = "output/results_cn"

[exits.rules]
exclude_st = true
min_median_amount_20d = 50000000.0
max_suspend_sessions = 5
min_model_percentile = 30.0
take_profit_pos = 0.80
take_profit_ret20 = 0.15
take_profit_reduce_ratio = 0.34
max_weight = 0.35
lot_size = 100 # A 股按手交易；减仓数量向下取整到整手
stop_loss_pct = 0.0 # 样本期该规则无效，默认关闭

[paper_outcomes]
selection_path = "output/results_cn/cn_ensemble_selected.csv"
days = 756
horizons = [1, 5, 20, 60]
cost_bps = 10.0
# Optional CSV with trade_date, close (or date, price). If empty, reports use
# the explicitly named cross-sectional market proxy.
benchmark_path = ""
output_dir = "output/paper_trading"

[paper_account]
selection_path = "output/results_cn/cn_ensemble_selected.csv"
days = 756
account_id = "cn_default"
strategy_version = "cn-ensemble.v1"
initial_capital = 45000.0
commission_bps = 5.0
slippage_bps = 5.0
lot_size = 100
output_dir = "output/paper_trading/account"

[graph_temporal]
days = 365
lookback = 20
epochs = 5
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/graph_temporal/alpha_zoo_hk"

[model_comparison]
prediction_paths = { lightgbm = "output/oos_predictions/cn_lightgbm_oos_predictions.csv", transformer = "output/oos_predictions/cn_transformer_oos_predictions.csv" }
output_dir = "output/evaluations"
prefix = "cn_model_comparison"
target_col = "forward_return_20d"
n_splits = 5
min_train_days = 120
purge_days = 20
embargo_days = 0

[oos_predictions]
# This stage retrains strictly on each expanding fold. LightGBM and Transformer
# are the default comparable baselines; add CNN only after its OOS value is needed.
models = ["transformer"]
# "lightgbm",
days = 756
label_horizon = 20
cleaning_version = "p0.2.v1"
output_dir = "output/oos_predictions"
n_splits = 5
min_train_days = 120
purge_days = 20
embargo_days = 0
transformer_lookback = 60
transformer_epochs = 5
# Use every fifth OOS decision date for a weekly-rebalanced deep-model study.
# Set to 1 for daily OOS predictions when runtime permits.
prediction_stride = 5
transformer_batch_size = 256
transformer_max_samples = 12000
transformer_max_feature_pairs = 128
transformer_device = "auto"
# Required only when models contains graph_temporal. The CSV must have
# stock_code, industry_l1 and available_at; current industry labels are invalid
# for historical graph OOS evaluation.
industry_mapping_path = ""
