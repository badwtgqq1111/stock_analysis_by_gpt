[pipeline]
market = "CN"

start_date = "2014-01-01"
end_date = ""
adjust = "qfq"
days = 365
factor_set = "alpha_zoo_hk"
top_n = 10
# 预选阶段模型候选数：4 -> 8。2026-09-15 的 4 只模型 Top-4 全被 sleeve 下限挤出，
# 扩大候选池让 PK 在"可成交 + 预算可行"的前提下有更多模型侧选择（见
# output/verification/preselect_review_20260916/ 与 event_study_20260916/）。
preselection_model_slots = 8
max_workers_sync = 12
max_workers_stock_info = 8
max_workers_valuation = 12
max_workers_financial = 4
# BaoStock financial-statement requests are serialized by the provider and
# are not needed for the historical market-cap/PE/PB panel. Enable only for a
# separate statement-data refresh.
financial_metrics_enabled = false
financial_lookback_quarters = 1
valuation_history_source = "baidu"
valuation_history_period = "全部"
max_workers_factors = 8
export_csv = "output/results_cn"
preselection_path = "output/results_cn/cn_ensemble_preselected.csv"
quality_report_dir = "output/data_quality"
min_ohlcv_rows = 120
min_training_stocks = 50
# Fundamental and alternative fields are optional inputs. Their coverage is reported,
# not used to discard otherwise valid price/volume samples.
min_fundamental_coverage = 0.80


# 数据健康硬门（2026-09-29 新增）：当日 bar 覆盖率 = 当日有 bar 的股票数 / 最近 10 个交易日的中位数。
# 9/29 实测第一次同步只有 68%，补抓 3 次到 95%——这种残缺如果继续算因子/打分，
# 会像 9/28 的资金流那样静默污染信号。enforce=不达标中止，warn=只告警。
[pipeline.data_health]
enabled = true
mode = "enforce"          # enforce | warn | off
# 阈值依据（2026-09-29 实测）：9/29 缺 267/5210 = 5.1%，且**分散在所有板块**
# （002:79 / 600:49 / 300:48 / 000:25 / 688:18 …），补抓两轮未改善 → 属于"停牌 + 源滞后"，
# 不是同步故障。同步故障的形态是 68%（第一次同步 3559/5221）这种**成批缺失**。
# 另外：真正防"不可成交还去选"的是 [selection.universe_filter].require_recent_bar_sessions（停牌直接剔除），
# 覆盖率门只负责拦住成批缺失。因此阈值落 0.95。
min_bar_coverage = 0.95
lookback_sessions = 10
stages = ["features", "clean_panel", "lightgbm", "model_scores", "preselection", "pk"]

[factor_config.valuation_hk]
# Baidu valuations are sparse observations. Keep the as-of value, and give
# models an explicit stale marker after this many completed trading sessions.
stale_after_trading_days = 20

[stages]
daily_bars = true
moneyflow = true
intraday_bars = false
fundamental = true
alternative = false
features = true
regime = true
clean_panel = true
lightgbm = true
transformer = true
cnn = false
model_scores = true
# 最终选股由 preselection → pk 两阶段完成；保留 selection 命令仅用于
# 临时对照或人工显式调用，默认全流程不运行它。
selection = false
preselection = true
pk = true
exits = true
paper_outcomes = false
paper_account = false
graph_temporal = false
model_comparison = false
oos_predictions = false
strategy_labels = false
# 小市值轮动策略（知乎「鳄鱼鱼」2022-10 版）回测 + 最新一期目标持仓。
# 只读阶段，不写数据层；默认不参与每日 all 流程（约 40 秒），需要时显式：
#   uv run python scripts/run_cn_pipeline.py --stage xiaomkt_rotation
xiaomkt_rotation = false

[daily_bars]
# Tencent is primary; fallbacks are BaoStock and Eastmoney.  The default chain
# intentionally excludes Sina because its V8 decoder is unsafe under bulk
# macOS concurrency.
data_source = "tencent"
frequencies = ["daily"]
skip_existing = true
complete_data = false

[moneyflow]
# 每日资金流与日 K 使用同一交易日窗口；历史回补按年度分段，避免中继日期范围限制。
enabled = true
start_date = ""
end_date = ""
lookback_days = 756
batch_years = 1
max_workers = 16
fetch_top_list = true
fetch_top_inst = true
fetch_mode = "trade_date"
fetch_standard = true
fetch_dc = true
fetch_ths = true
# 官方 Token 优先；官方接口失败时回退到“智能体数据中心免费版”兼容接口。
# daily_basic/cyq_perf/cyq_chips 是三把锁的增强源。cyq_chips 采用股票级
# 分页、断点续跑，初次历史回补耗时较长但后续每日仅补新窗口。
fetch_daily_basic = true
fetch_cyq_perf = true
# cyq_chips 是可选的全量价格档位历史，改由 --stage cyq_chips 分批回补；
# 不阻塞每日 moneyflow 同步和模型更新。
fetch_cyq_chips = false
fetch_hm_detail = true
cyq_chips_stock_limit = 0
# cyq_chips 的官方、Base Relay、ProMax Relay 会分片并行。workers 是每个
# 来源的并发数；每个来源保有独立的一分钟请求预算与 429 Retry-After 退避。
cyq_chips_max_workers = 8
cyq_chips_read_timeout = 20
# Tushare 10,000 积分档为 200/min；ProMax IP 档为 200/min，均保留余量。
cyq_chips_requests_per_minute = 195
cyq_chips_base_requests_per_minute = 180
cyq_chips_promax_requests_per_minute = 180
official_first = true
capital_features_mode = "source_bundle_with_official_fallback"
require_daily_bar_match = true
min_match_ratio = 0.98
raw_dir = "assets/data/raw/moneyflow_snapshots"
feature_path = "assets/data/derived/cn_moneyflow_features.parquet"

[intraday_bars]
# Enable only when minute-level features or execution research needs these bars.
# The window is independent from daily bars to avoid requesting minute data since 2014.
lookback_days = 1095
# Tencent retains a rolling recent window. Use 5min as the base frequency.
frequencies = ["5min", "15min", "30min", "60min"]
data_source = "tencent"
adjust = "raw"
max_workers = 16
derive_intraday_from_1min = false
derive_intraday_from_base = true
intraday_base_frequency = "5min"
min_daily_rows_for_intraday = 120
skip_existing = true
complete_data = false

[alternative]
# Import a locally collected CN search/news/announcement export. Required
# columns: stock_code plus published_at or available_at; optional sentiment_score.
input_path = ""
source = "manual_import"
output_dir = "output/alternative_data"

[industry]
# 当前生产主源使用 BaoStock 的证监会行业分类，接口已覆盖全市场且可稳定
# 调用。验证过的申万 2021 中继源可设为 sw2021_relay（需要
# CN_INDUSTRY_RELAY_BASE_KEY 或 TUSHARE_RELAY_KEY）；它写入独立 sw2021 快照，
# 只有完整同步通过覆盖率门禁后才更新注册表，不能混用两种 taxonomy。
taxonomy = "csrc_baostock"
min_coverage = 0.95

[relay_data]
# 仅在已配置 CN_INDUSTRY_RELAY_BASE_KEY 或 TUSHARE_RELAY_KEY 时开启。daily_basic
# 会覆盖同日估值快照的估值/股本字段；默认关闭，先用小股票池验证覆盖率与口径。
enabled = false
start_date = ""
end_date = ""
# Independent raw adj_factor audit snapshot; this does not overwrite OHLCV.
adjustment_factors_enabled = false

[strategy_labels]
days = 756
output_dir = "output/strategy_labels"
entry_delay = 1
path_horizon = 60
startup_low_window = 120
startup_min_rise = 0.05
startup_max_rise = 0.30
startup_max_return_60d = 0.35
startup_max_high_distance = -0.05
take_profit = 0.20
stop_loss = 0.10

[clean_panel]
# 与 config/cn_pipeline_p1_17_startup.toml 保持一致：干净面板是共享数据集，
# 若这里用更小的窗口重建，会把 13 折 OOS 基准所依赖的历史删掉（service 会告警但不会阻止）。
days = 560
cleaning_version = "p0.2.v1"
# Stock-aware row-group indexing makes larger batches efficient while keeping
# the wide pivot bounded. The source parquet is indexed once per clean-panel run.
feature_batch_size = 50

[model_features]
# Reject a source feature and its missing-value mask when the value is present
# on fewer than this share of a training fold. Sparse but usable features retain
# their masks; all-missing and constant inputs never enter model artifacts.
min_feature_coverage = 0.05
drop_constant_features = true
# 因子 IC 准入（2026-09-27 起）：清单由 scripts/factor_ic_protocol.py 生成，规则 = |IC|>=0.02 且
# |ICIR|>=0.30 且 BH-FDR(q=0.05) 显著 且 前后半段同号 且 是 |rho|>=0.9 相关簇的代表。
#   off   用全部 1,366 列（现状）        apply 只喂准入列        warn 只记录不裁剪
# 实测（2026-06-04~08-27 同切分验证窗口，准入期只用 2025-03~2026-05）：
#   准入 94 列 → 日频秩 IC +0.1486 / t=+19.4 / 60 天零负值 ； 全集 1,294 列 → -0.0218
# 注意：清单必须与面板列同名（*_clean 等）；换 factor_set 或改特征命名要重跑协议再更新清单。
admission_mode = "apply"
admission_file = "output/research/factor_ic_protocol/factor_ic_admitted.json"

[regime]
days = 756
min_stocks = 20
trend_window = 60
breadth_window = 20
volatility_window = 20
hysteresis_days = 3
version = "regime.v1"
output_dir = "output/regime"

# 小市值轮动策略：每周二调仓的小市值 top-5 等权组合。
# 规则与偏差说明见 docs/runbooks/cn-data-pipeline.md 与
# artifacts/xiaomkt_rotation_20261001/REPORT.md（本地复现：2014-2024 年化 44.41%、
# 回撤 -23.03%；文章宣称 103.32% 只在"同日收盘成交 + 零成本 + 无次新过滤"的天真口径下成立）。
[xiaomkt_rotation]
start_date = "2015-01-05"
end_date = ""
initial_cash = 100000
top_n = 5                  # 等权持有只数
candidate_pool = 50        # 市值升序备选池
universe = "main"          # main = 沪深主板；sme = 深市 002+003（中小综指代理）
cadence = "weekly"         # weekly = 每周二；daily = 每日
max_price = 80             # 高价股过滤（元）
min_listing_days = 365     # 次新股过滤：上市不满 1 年排除
exclude_st = true          # ST 过滤；判定口径见 st_filter_mode
st_filter_mode = "touch"    # band = 5% 涨跌停板识别（推荐）；touch = 旧触板计数；both = 并集
st_exit = true             # 持仓中途被 ST 判定命中 -> 下一个调仓日卖出
use_limitup_hold = true    # 昨日涨停不卖
use_stop_loss = true       # 个股硬止损
stop_loss = 0.07
use_market_filter = true   # 股票池等权急跌清仓
market_filter = 0.05
market_filter_lookback = 5
use_magic_months = true    # 1/5-2/5、4/5-4/30 不买入
commission = 0.00025
stamp_duty = 0.001
slippage = 0.0003
min_commission = 5
cap_ffill_limit = 20       # 市值快照最多前向填充天数
# 幸存者偏差修复：并入 scripts/refresh_cn_delisted_daily.py 产出的退市股日线 +
# 历史市值（daily_basic 的 total_mv）。退市/长期停牌持仓按 delist_haircut 折价清算。
include_delisted = true
delisted_panel = "meta/cn_delisted_daily.parquet"
delist_haircut = 0.0      # 0 = 退市/长停按最后收盘价清算；可设 0.3/0.5 做压力测试
delist_exit_grace = 20
output_dir = "output/results_cn/xiaomkt_rotation_touch"

[lightgbm]
days = 365
label_horizon = 20
label_mode = "forward_return" # path_score_20d enables the new startup path target
startup_only = false
validation_days = 60
embargo_days = 20
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/lightgbm/alpha_zoo_hk"
# Leave empty for a fresh scheduled retrain; set a compatible model.txt for warm-start.
warm_start_path = ""
# The label is a within-date cross-sectional rank, so plain L2 has a floor equal
# to the label variance (~1/12). On this weak-signal problem, early stopping on
# L2 trims the booster to a handful of trees (measured: 3), which collapses the
# score range and breaks the cross-sectional ranking the selection stage reads.
# Default: stop on the mean per-date IC, with a hard floor on kept trees.
n_estimators = 500
learning_rate = 0.05
num_leaves = 64
max_depth = 8
min_child_samples = 30
reg_lambda = 10.0
# Early stopping is disabled because LightGBM trims the saved booster to the best
# iteration: with a flat metric it silently kept only 3 of 500 trees, which is
# what collapsed the score range.  Raise this only if the IC curve peaks late.
early_stopping_rounds = 0
min_trees = 100
eval_metric = "daily_ic" # daily_ic | l2 | none

[transformer]
days = 365
label_horizon = 20
label_mode = "forward_return" # path_score_20d enables the new startup path target
startup_only = false
validation_days = 60
embargo_days = 20
lookback = 60
# 12k 序列 × 10 epoch 的预算下，同配置重复训练的 09-15 rank IC 在 0.164~0.349 之间跳动
# （sd≈0.093，见 output/verification/retrain_20260916/transformer_probe_baseline-config.csv），
# 说明"变压器变差"主要是样本/初始化噪声而非特征变多。这里把预算提到 36k 序列 × 20 epoch，
# 并把特征对上限从 128 提到 256（不删任何特征，让新特征也能进入交互项）。
epochs = 20
batch_size = 256
max_samples = 36000
max_feature_pairs = 256
protected_features = [
  "flow_second_wave_flag",
  "flow_second_wave_source_count",
  "flow_second_wave_max_z5",
  "flow_second_wave_seed_age",
  "flow_second_wave_pullback_pct",
  "flow_second_wave_price_recovery_1d",
]
# 多随机种子 + 按"验证集 rank IC"选 checkpoint（Huber 只在 IC 并列时做次级判据）。
# 同配置重复训练的 09-15 rank IC 标准差约 0.093，单次训练不可复现；
# 种子内选最优 epoch、再在若干种子间取最优，可同时降方差、提均值。
seeds = [0, 1, 2]
checkpoint_metric = "ic"
# 推理时对多个种子的权重取"预测平均"（invalid 的是权重平均，预测平均才有效）。
# 每种子验证 IC 之间差约 0.05、单日打分离散约 0.09，平均比择优更稳。
seed_ensemble = "average"
learning_rate = 0.001
d_model = 64
nhead = 4
num_layers = 2
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/transformer/alpha_zoo_hk"
device = "auto" # CUDA -> Apple MPS -> CPU
# Set both values to a prior compatible checkpoint for incremental fine-tuning.
warm_start_path = ""
warm_start_manifest_path = ""

[cnn]
days = 365
label_horizon = 20
validation_days = 60
embargo_days = 20
lookback = 60
epochs = 10
batch_size = 256
max_samples = 12000
max_feature_pairs = 128
protected_features = [
  "flow_second_wave_flag",
  "flow_second_wave_source_count",
  "flow_second_wave_max_z5",
  "flow_second_wave_seed_age",
  "flow_second_wave_pullback_pct",
  "flow_second_wave_price_recovery_1d",
]
channels = 64
kernel_size = 3
num_layers = 3
cleaning_version = "p0.2.v1"
model_dir = "output/models/cn/cnn/alpha_zoo_hk"
device = "auto"

[model_scores]
days = 365
cleaning_version = "p0.2.v1"
# Do not select from a partially materialized latest date. The scorer falls
# back to the newest date that covers at least this share of the universe.
min_cross_section_coverage = 0.95
# 打分前输入体检（R2 覆盖率 + R11 单位合理性）：
#   enforce  覆盖率不达标直接中止；单位可疑的股票从当日截面剔除（占比超阈值也中止）
#   warn     只记录，不阻断
#   off      关闭
# gain 加权覆盖率 = 用 LightGBM gain 给“被使用列”的当日覆盖率加权，能量化静默劣化
# （2026-09-23 实测 0.107，属于必须中止的状态）。
input_guard = "enforce"
input_guard_min_gain_coverage = 0.5
input_guard_min_columns = 0.9
input_guard_sessions = 30
input_guard_max_excluded_share = 0.05
output_dir = "output/model_scores"
lightgbm_model_path = "output/models/cn/lightgbm/alpha_zoo_hk/model.txt"
lightgbm_manifest_path = "output/models/cn/lightgbm/alpha_zoo_hk/model_manifest.json"
transformer_model_path = "output/models/cn/transformer/alpha_zoo_hk/model.pt"
transformer_manifest_path = "output/models/cn/transformer/alpha_zoo_hk/model_manifest.json"
transformer_device = "auto"
cnn_model_path = ""
cnn_manifest_path = ""
cnn_device = "auto"

# ============================================================================
# 策略注册表（2026-09-29 新增）：策略 = (信号, 状态/资格, 仓位, 退出, 预算, 证据)
#
# 为什么：模型腿与突破腿对"入场状态"的偏好是相反的——模型腿要"贴近 120 日低点 + 缩量"，
# 突破腿要"刚突破 + 放量"。把两种策略塞进一个全局标量门禁（startup_gate 的 4 项加权和）
# 必然互相抵消（实测 k_high 的 IC 是 −0.371，方向就是反的）。
# 门禁因此降级为"每个策略自己的 state 段"，组合层只做策略间预算分配与执行约束。
#
# 本段目前**只用于归因与治理**（factor_engine/strategies.py 读取、归因报告按 strategy_id
# 归组），尚未改变选股行为；接线顺序见 docs/todo/P1_22 §23.4。
# 新增策略 = 加一个 [strategies.<id>] 段 + 一个信号函数（factor_engine/signals/），
# 不需要改门禁/组合层代码。
# ============================================================================

[strategies.model_alpha]
kind = "model"
status = "active"
# 2026-09-30 修正声明：实测模型分 Top-20 里只有 10% 落在"贴近低点"带内（全市场 39% 落在带内），
# dist_from_120d_low 中位 ≈0.6 —— 这个模型的头部是**强势/动量**票，不是低吸票。
# 因此如实声明为"全截面 alpha，不做位置约束"，位置/资金流只作为**正交化剥离**的暴露
# （正交化实测优于软倾斜：Top50 +6.07%/t=3.17 vs +3.27%/t=0.89）。
label = "模型腿：全截面 alpha（无位置约束；dist/flow 只做正交化剥离）"
signal = { source = "lightgbm", score = "orthogonalized_residual", features = "admitted_90", orthogonalize_exposures = ["dist_from_120d_low", "flow_z"] }
# 不再声明入场状态（曾经的 dist∈[0.05,0.30]+缩量+flow 与模型实际行为相反，属于错声明）
sizing = { slots = 4, min_weight = 0.0, max_weight = 0.35 }
exit = { stop_loss_atr_multiple = 2.5, stop_loss_min_pct = 0.04, stop_loss_max_pct = 0.10, take_profit_ret20 = 0.15 }
budget = { share = 0.90, note = "2026-10-01 起 0.75→0.90：sleeve 层在可交易口径下无正 edge（见 P1.22 §32/§33）" }
evidence = { valid_rank_ic = 0.1414, head_state_conformance = "Top-20 仅 10% 落在低吸带内（2026-09-29 实测）", updated = "2026-09-30" }

[strategies.dip_low_position]
kind = "signal"
status = "research"   # 只在研究态：跑通 A/B（模型分在低吸子集内排序 vs 全截面）再决定是否上生产
label = "低吸腿（研究态）：贴近自身低位 + 缩量 + 资金流确认，再按模型分排序"
signal = { recipe = "model_dip", rank = "model_score", note = "候选 = 满足 state 的子集；排序用模型分" }
sizing = { slots = 1, min_weight = 0.06, max_weight = 0.15 }
exit = { expected_holding_days = 20 }
budget = { share = 0.0, note = "研究态不占预算；转 active 时从 model_alpha 划出 share" }
evidence = { status = "A/B 已完成：不达标，保持 research", abl_k12 = "B 先低吸过滤再排序 +0.76%/t=0.63 vs A 全截面 +3.15%/t=1.48（13 非重叠窗口）", subset_note = "低吸子集平均 729 只（占全截面 14%），子集内随机 −0.51%/20 日 → 该状态本身无 alpha", conclusion = "dist/flow 是风险暴露而非 alpha；模型头部是强势票（§28.4）。除非换标签/换信号，否则不转 active", updated = "2026-09-30" }
[strategies.dip_low_position.state]
dist_from_120d_low = { op = "between", lo = 0.05, hi = 0.30, note = "启动带" }
volume_ratio_20d = { op = "lte", value = 1.2, note = "缩量" }
flow_z = { op = "gte", value = 0.0, note = "资金流不为负" }

[strategies.donchian_breakout]
kind = "signal"
status = "off"
label = "突破腿：箱体/通道突破 + 放量确认"
signal = { recipe = "donchian_pullback", setup_types = ["donchian_breakout", "donchian_pullback", "range_breakout", "box_pullback"], rank = "volume_ratio_20" }
sizing = { slots = 2, min_weight = 0.06, max_weight = 0.20 }
exit = { expected_holding_days = 5, stop_atr = 1.5 }
budget = { sleeve_section = "", share = 0.10 }
evidence = { demoted_20261001 = "均值基准 5d −0.29%/t=−6.4（近两年 t=−2.6）→ 转 off",  event_study_5d = 0.0042, note = "突破类追高即失效：超上沿 >5% 后 5 日超额 −0.50%（t=−2.15）", updated = "2026-09-16" }
[strategies.donchian_breakout.state]
# 这些列都能从信号腿可见的 bars / recipe features 直接算出（service._cn_signal_candidates）
dist_from_60d_high = { op = "gte", value = -0.05, note = "贴近/突破 60 日高点（与模型腿相反）" }
volume_ratio_20d = { op = "gte", value = 1.3, note = "放量确认（与模型腿相反）" }
signal_extension = { op = "lte", value = 0.05, note = "尾随保护：超通道上沿 >5% 不追" }
signal_runup_5d = { op = "lte", value = 0.20, note = "尾随保护：5 日涨幅 >20% 不追" }

[strategies.limit_momentum]
kind = "signal"
status = "off"
label = "涨停动量腿（独立小预算 + 硬止损）"
