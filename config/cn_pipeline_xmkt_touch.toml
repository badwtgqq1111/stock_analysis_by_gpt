budget = { sleeve_section = "momentum_sleeve", share = 0.05 }
evidence = { demoted_20261001 = "均值基准 5d −1.35%/t=−8.1；复刻仓库定义后仍 −1.01%/t=−16.8（中位基准 −0.14%/t=−2.3）→ 转 off",  event_study_5d = 0.0068, note = "涨停次日 +1.30%/+0.68%，10 日衰减到 0", updated = "2026-09-16" }
[strategies.limit_momentum.state]
# 市场状态由 signals.momentum_sleeve.require_market_trend_up 控制；state 只放"个股级、可从 bars 算出"的条件。

[strategies.value_reversal]
kind = "signal"
