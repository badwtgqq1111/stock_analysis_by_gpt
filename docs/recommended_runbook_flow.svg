  <text class="chip-text" x="1101" y="149" text-anchor="middle">导出</text>
  <text class="section-title" x="1152" y="150">生产选股产物</text>

  <g transform="translate(1074 174)">
    <rect class="card card-amber" x="0" y="0" width="284" height="56"/>
    <rect class="bar-amber" x="0" y="0" width="284" height="6" rx="8" ry="8"/>
    <text class="label-small" x="142" y="28" text-anchor="middle">ranking / selected</text>
    <text class="text-small" x="142" y="47" text-anchor="middle">candidates / watchlist</text>
  </g>

  <g transform="translate(1074 248)">
    <rect class="card card-amber" x="0" y="0" width="284" height="56"/>
    <rect class="bar-amber" x="0" y="0" width="284" height="6" rx="8" ry="8"/>
    <text class="label-small" x="142" y="28" text-anchor="middle">manifest / importance</text>
    <text class="text-small" x="142" y="47" text-anchor="middle">SHAP exports</text>
  </g>

  <g transform="translate(1074 322)">
    <rect class="card card-amber" x="0" y="0" width="284" height="56"/>
    <rect class="bar-amber" x="0" y="0" width="284" height="6" rx="8" ry="8"/>
    <text class="label-small" x="142" y="28" text-anchor="middle">liquidity_capacity</text>
    <text class="text-small" x="142" y="47" text-anchor="middle">simulated TCA</text>
  </g>

  <rect class="section section-fill-cyan" x="48" y="440" width="920" height="250"/>
  <rect class="chip" x="72" y="462" width="74" height="24"/>
  <text class="chip-text" x="109" y="479" text-anchor="middle">可选</text>
  <text class="section-title" x="160" y="480">选股前特征层</text>

  <g transform="translate(82 522)">
    <rect class="card card-cyan" x="0" y="0" width="188" height="78"/>
    <rect class="bar-cyan" x="0" y="0" width="188" height="7" rx="8" ry="8"/>
    <text class="label-small" x="94" y="32" text-anchor="middle">stock-intelligence</text>
    <text class="text-small" x="94" y="55" text-anchor="middle">画像 / 图谱 / 主题机会</text>
  </g>

  <g transform="translate(294 522)">
    <rect class="card card-cyan" x="0" y="0" width="188" height="78"/>
    <rect class="bar-cyan" x="0" y="0" width="188" height="7" rx="8" ry="8"/>
    <text class="label-small" x="94" y="32" text-anchor="middle">event features</text>
    <text class="text-small" x="94" y="55" text-anchor="middle">事件/NLP -> 日频</text>
  </g>

  <g transform="translate(506 522)">
    <rect class="card card-cyan" x="0" y="0" width="188" height="78"/>
    <rect class="bar-cyan" x="0" y="0" width="188" height="7" rx="8" ry="8"/>
    <text class="label-small" x="94" y="32" text-anchor="middle">microstructure</text>
    <text class="text-small" x="94" y="55" text-anchor="middle">分钟线 -> 日频微结构</text>
  </g>

  <g transform="translate(718 522)">
    <rect class="card card-cyan" x="0" y="0" width="188" height="78"/>
    <rect class="bar-cyan" x="0" y="0" width="188" height="7" rx="8" ry="8"/>
    <text class="label-small" x="94" y="32" text-anchor="middle">fetch-alt</text>
    <text class="text-small" x="94" y="55" text-anchor="middle">新闻情绪特征</text>
  </g>

  <g transform="translate(610 626)">
    <rect class="card card-cyan" x="0" y="0" width="236" height="72"/>
    <rect class="bar-cyan" x="0" y="0" width="236" height="7" rx="8" ry="8"/>
    <text class="label" x="118" y="31" text-anchor="middle">特征仓库</text>
    <text class="text-small" x="118" y="54" text-anchor="middle">Parquet / ClickHouse</text>
  </g>

  <rect class="section section-fill-green" x="1040" y="440" width="352" height="250"/>
  <rect class="chip" x="1064" y="462" width="74" height="24"/>
  <text class="chip-text" x="1101" y="479" text-anchor="middle">验收</text>
  <text class="section-title" x="1152" y="480">选股后研究诊断</text>

  <g transform="translate(1074 516)">
    <rect class="card card-green" x="0" y="0" width="284" height="58"/>
    <rect class="bar-green" x="0" y="0" width="284" height="6" rx="8" ry="8"/>
    <text class="label-small" x="142" y="28" text-anchor="middle">模型与主题诊断</text>
    <text class="text-small" x="142" y="48" text-anchor="middle">model / theme diagnostics</text>
  </g>

  <g transform="translate(1074 596)">
    <rect class="card card-green" x="0" y="0" width="284" height="58"/>
    <rect class="bar-green" x="0" y="0" width="284" height="6" rx="8" ry="8"/>
    <text class="label-small" x="142" y="28" text-anchor="middle">研究验证</text>
    <text class="text-small" x="142" y="48" text-anchor="middle">Purged CV / A/B / ablation</text>
  </g>

  <g transform="translate(1074 716)">
    <rect class="card card-green" x="0" y="0" width="284" height="72"/>
    <rect class="bar-green" x="0" y="0" width="284" height="7" rx="8" ry="8"/>
    <text class="label-small" x="142" y="31" text-anchor="middle">执行与组合研究</text>
    <text class="text-small" x="142" y="54" text-anchor="middle">execution / cost / policy eval</text>
  </g>

  <path class="edge" d="M 252 227 H 300"/>
  <path class="edge" d="M 470 227 H 498 V 182 H 526"/>
  <path class="edge" d="M 470 227 H 498 V 290 H 526"/>
  <path class="edge" d="M 722 182 H 754 V 231 H 790"/>
  <path class="edge" d="M 722 290 H 754 V 231 H 790"/>
