[project]
name = "stock-analysis-by-gpt"
version = "0.1.0"
description = "Local quant research and backtesting toolkit for HK/CN stocks based on Parquet and DuckDB."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare",
    "baostock",
    "clickhouse-connect>=1.0.1",
    "clickhouse-driver>=0.2.10",
    "dash>=4.1.0",
    "dash-bootstrap-components>=1.6.0",
    "demjson3",
    "duckdb",
    "fastapi>=0.136.1",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly>=6.7.0",
    "py-mini-racer",
    "pyarrow",
    "requests",
    "scikit-learn",
    "scipy",
    "shap>=0.49.1",
    "TA-Lib",
    "urllib3",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
akshare = { path = "../akshare", editable = true }
